################################################################################
#                                                                              #
#                         NEON TIGER AESTHETICS                                #
#                                                                              #
################################################################################

# ─────────────────────────────────────────────────────────────────────────────
# GENERAL  (Layout, gaps, borders)
# ─────────────────────────────────────────────────────────────────────────────
general {
    gaps_in  = 5
    gaps_out = 10

    # Thicker neon glow effect
    border_size = 3

    # Hot magenta/pink neon borders
    col.active_border   = rgba(ff00ffff) rgba(ff1493ff) 45deg
    col.inactive_border = rgba(8b008baa)

    resize_on_border = false
    allow_tearing = false
    layout = master
}


# ─────────────────────────────────────────────────────────────────────────────
# MASTER LAYOUT
# ─────────────────────────────────────────────────────────────────────────────
master {
    allow_small_split     = true
    special_scale_factor  = .95
    mfact                 = .65
    new_on_top            = false
    new_on_active         = none
    new_status            = slave
    orientation           = left
}


# ─────────────────────────────────────────────────────────────────────────────
# DECORATION  (Corners, opacity, shadows, blur)
# ─────────────────────────────────────────────────────────────────────────────
decoration {
    rounding        = 10
    rounding_power  = 2

    # Transparent purple glass effect
    active_opacity   = 0.75
    inactive_opacity = 0.65

    shadow {
        enabled       = true
        range         = 40
        render_power  = 5
        # Magenta glow shadow
        color         = rgba(ff00ff44)
    }

    blur {
        enabled  = true
        size     = 8
        passes   = 3
        vibrancy = 0.2
    }
}


# ─────────────────────────────────────────────────────────────────────────────
# ANIMATIONS (Timing curves & motion)
# ─────────────────────────────────────────────────────────────────────────────
animations {
    enabled = yes, please :)

    # Snappier curves for neon aesthetic
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # Slightly faster for energy
    animation = global,        1,     10,    default
    animation = border,        1,     4,     easeOutQuint
    animation = windows,       1,     4,     easeOutQuint
    animation = windowsIn,     1,     3.5,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.2,   linear,       popin 87%
    animation = fadeIn,        1,     1.5,   almostLinear
    animation = fadeOut,       1,     1.2,   almostLinear
    animation = fade,          1,     2.5,   quick
    animation = layers,        1,     3.5,   easeOutQuint
    animation = layersIn,      1,     3.5,   easeOutQuint, fade
    animation = layersOut,     1,     1.2,   linear,       fade
    animation = fadeLayersIn,  1,     1.5,   almostLinear
    animation = fadeLayersOut, 1,     1.2,   almostLinear
    animation = workspaces,    1,     1.5,   almostLinear, fade
    animation = workspacesIn,  1,     1,     almostLinear, fade
    animation = workspacesOut, 1,     1.5,   almostLinear, fade
    animation = zoomFactor,    1,     6,     quick
}


# ─────────────────────────────────────────────────────────────────────────────
#  DWINDLE
# ─────────────────────────────────────────────────────────────────────────────
dwindle {
    pseudotile       = true
    preserve_split   = true
}


# ─────────────────────────────────────────────────────────────────────────────
# MISC
# ─────────────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper  = -1
    disable_hyprland_logo    = false
}
