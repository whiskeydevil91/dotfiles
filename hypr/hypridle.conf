################################################################################
#                                                                              #
#                              SLEEP TIMER (hypridle)                          #
#                                                                              #
################################################################################
# What happens when the computer is left alone.
#
#   9 min   warning notification
#   10 min  lock screen (hyprlock)
#   11 min  monitors off
#   30 min  suspend (sleep)
#
# Change a `timeout` (in seconds) to adjust a step, or delete a listener
# block to skip it. Fullscreen windows (games, videos) and apps that ask to
# stay awake pause the timer.
#
# hypridle still uses its own config format, not Lua.
# See: https://wiki.hypr.land/hypr-ecosystem/user/hypridle/

general {
    lock_cmd         = pidof hyprlock || hyprlock                                    # only one lock screen at a time
    before_sleep_cmd = loginctl lock-session                                         # always lock before sleeping
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'         # wake monitors on resume
}

# 9 min: heads-up
listener {
    timeout    = 540
    on-timeout = notify-send -u low "Sleep timer" "Locking in 1 minute"
}

# 10 min: lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 11 min: monitors off
listener {
    timeout    = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 30 min: suspend
listener {
    timeout    = 1800
    on-timeout = systemctl suspend
}
