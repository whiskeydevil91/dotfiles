################################################################################
#                                                                              #
#                              LOCK SCREEN (hyprlock)                          #
#                                                                              #
################################################################################
# Neon lock screen on top of the default wallpaper.
# Clear the password field with ESC or Ctrl+U.
#
# hyprlock still uses its own config format, not Lua.
# See: https://wiki.hypr.land/hypr-ecosystem/user/hyprlock/

$font = IBM Plex Mono
$cyan = rgba(00e5ffff)
$pink = rgba(ff2bd6ff)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/default.png
    blur_passes = 2
    brightness = 0.6
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 96
    font_family = $font
    color = $cyan
    shadow_passes = 2
    shadow_color = $cyan
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_size = 24
    font_family = $font
    color = $pink
    position = 0, 130
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    rounding = -1
    inner_color = rgba(0b0014cc)
    outer_color = $pink $cyan 45deg
    check_color = $cyan $pink 120deg
    fail_color = rgba(ff0055ff) $pink 40deg
    font_color = rgba(f2e9ffff)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}
