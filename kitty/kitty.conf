# Font
font_family      IBM Plex Mono
bold_font        auto
italic_font      auto
font_size        12.5

# Line spacing for manga/editorial feel
modify_font cell_height 110%


# === NEON PURPLE THEME ===

# Background: Deep purple with transparency
background #1a0a2e
background_opacity 0.75

# Foreground: Bright cyan
foreground #00ffff

# Cursor: Hot magenta
cursor #ff00ff
cursor_text_color #000000

# Selection: Magenta highlight
selection_foreground #000000
selection_background #ff00ff


# === NEON COLOR PALETTE ===

# Black/Dark
color0  #0a0a0a
color8  #4a4a4a

# Red/Bright Red (neon pink)
color1  #ff0066
color9  #ff3399

# Green/Bright Green (neon cyan-green)
color2  #00ff99
color10 #66ffcc

# Yellow/Bright Yellow (electric yellow)
color3  #ffff00
color11 #ffff66

# Blue/Bright Blue (neon blue)
color4  #0066ff
color12 #3399ff

# Magenta/Bright Magenta (hot pink)
color5  #ff00ff
color13 #ff66ff

# Cyan/Bright Cyan (electric cyan)
color6  #00ffff
color14 #66ffff

# White/Bright White
color7  #cccccc
color15 #ffffff


# === Cursor: Animated Neon Block ===

# Shape & color
cursor_shape block

# Prevent shell from forcing beam cursor
shell_integration no-cursor


# === Blink (Animated, Not Retro) ===

# 1 second total cycle:
# - 0.5s fade out
# - 0.5s fade in
cursor_blink_interval 0.5 ease-in-out

# Keep blinking indefinitely
cursor_stop_blinking_after 0


# === Cursor Trail (Generous, Cinematic) ===

# Enable trail for cursor jumps after pause
cursor_trail 50

# Fast → slow decay (ink absorption feel)
cursor_trail_decay 0.12 0.45

# Require meaningful movement before trail
cursor_trail_start_threshold 2

# Use cursor background color (magenta glow)
cursor_trail_color none
